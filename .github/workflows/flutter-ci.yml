name: Flutter CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Versions
        run: flutter --version

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Build APK (release, test backend)
        shell: bash
        env:
          # Repository secrets; push stays disabled in the APK when they are unset.
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
        run: |
          set -o pipefail
          flutter build apk --release \
            --dart-define=API_URL=https://test.allinone.ovh \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_SENDER_ID="$FIREBASE_SENDER_ID" \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_ANDROID_APP_ID="$FIREBASE_ANDROID_APP_ID" \
            2>&1 | tee build.log

      - name: Report build error
        if: failure()
        shell: bash
        run: |
          # Surface the end of the log as an annotation (readable from the API).
          msg=$(grep -v '^\s*$' build.log | tail -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=build::${msg}"

      - uses: actions/upload-artifact@v4
        with:
          name: comptaflow-client-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
