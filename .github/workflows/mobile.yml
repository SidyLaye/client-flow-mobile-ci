name: Mobile (APK)

on:
  push:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Versions
        run: flutter --version

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Build APK (release, test backend)
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release --dart-define=API_URL=https://test.allinone.ovh 2>&1 | tee build.log

      - name: Report build error
        if: failure()
        shell: bash
        run: |
          # Surface the end of the log as an annotation (readable from the API).
          msg=$(grep -v '^\s*$' build.log | tail -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=build::${msg}"

      - uses: actions/upload-artifact@v4
        with:
          name: comptaflow-client-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
