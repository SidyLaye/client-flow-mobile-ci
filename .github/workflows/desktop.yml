name: Desktop build (Windows .exe)

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Backend used by the installed app.
      VITE_API_URL: https://test.allinone.ovh
      # src-tauri/.cargo/config.toml points target-dir at a local desktop path.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Build installer
        shell: bash
        run: |
          set -o pipefail
          npx tauri build --bundles nsis 2>&1 | tee build.log

      - name: Report build error
        if: failure()
        shell: bash
        run: |
          msg=$(grep -v '^\s*$' build.log | tail -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=build::${msg}"

      - name: Locate installer
        shell: bash
        run: |
          f=$(find . -path ./node_modules -prune -o -path '*bundle/nsis/*.exe' -print | head -1)
          if [ -z "$f" ]; then
            info=$( (tail -40 build.log; echo '--- exe files:'; find . -path ./node_modules -prune -o -name '*.exe' -path '*release*' -print | head -20) | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=no-installer::${info}"
            exit 1
          fi
          echo "::notice title=installer::$f"
          mkdir -p dist-installer && cp "$f" dist-installer/

      - uses: actions/upload-artifact@v4
        with:
          name: comptaflow-desktop-windows
          path: dist-installer/*.exe
          if-no-files-found: error
          retention-days: 14
