name: client_flow_mobile
description: ComptaFlow Client — mobile companion app for accounting-firm clients (Flutter + BLoC).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # State management (BLoC)
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0

  # Backend
  supabase_flutter: ^2.17.2
  http: ^1.6.0

  # Navigation
  go_router: ^18.0.1

  # Scan / files / PDF
  cunning_document_scanner: ^3.0.3
  image_picker: ^1.2.3
  file_picker: ^13.1.0
  flutter_image_compress: ^2.5.1
  pdf: ^3.13.0
  path_provider: ^2.1.6
  share_plus: ^13.3.0

  # Push notifications
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  device_info_plus: ^13.2.0

  intl: ^0.20.3
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
